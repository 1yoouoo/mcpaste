name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ci-${{ github.event.workflow_run.head_sha }}
        run: |
          docker buildx build --platform linux/amd64 --tag "$IMAGE:$IMAGE_TAG" --push .
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$IMAGE_TAG")"
          case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          printf 'MCPASTE_IMAGE=%s@%s\n' "$IMAGE" "$digest" > /tmp/mcpaste-deploy.env

      - name: Verify deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.MCPASTE_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.MCPASTE_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          test -s "$RUNNER_TEMP/ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$RUNNER_TEMP/ssh/known_hosts" >/dev/null

      - name: Deploy by SSH
        env:
          DEPLOY_HOST: ${{ secrets.MCPASTE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MCPASTE_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.MCPASTE_DEPLOY_KEY }}
          HEALTH_ENDPOINT: ${{ secrets.MCPASTE_HEALTH_ENDPOINT }}
          SMOKE_TOKEN: ${{ secrets.MCPASTE_SMOKE_TOKEN }}
        run: |
          key_file="$RUNNER_TEMP/ssh/deploy_key"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          ssh_options=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          digest="$(awk -F= '$1 == "MCPASTE_IMAGE" {print $2}' /tmp/mcpaste-deploy.env)"
          printf '%s\n%s\n' "$HEALTH_ENDPOINT" "$SMOKE_TOKEN" |
            ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n /opt/mcpaste/deploy/deploy-image.sh '$digest' --smoke-stdin"
