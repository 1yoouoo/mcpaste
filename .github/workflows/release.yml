name: Linux release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build Linux artifacts
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "dist/mcpaste-$arch" ./cmd/mcpaste
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "dist/mcpaste-server-$arch" ./cmd/server
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "dist/mcpaste-migrate-$arch" ./cmd/migrate
          done
          go run github.com/google/go-licenses@v1.6.0 save ./... --ignore github.com/1yoouoo/mcpaste --save_path "$RUNNER_TEMP/THIRD_PARTY_LICENSES"
          tar -czf dist/THIRD_PARTY_LICENSES.tar.gz -C "$RUNNER_TEMP" THIRD_PARTY_LICENSES
          (cd dist && shasum -a 256 * > Linux-SHA256SUMS)
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  macos:
    name: macOS release
    needs: linux
    uses: ./.github/workflows/macos-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
