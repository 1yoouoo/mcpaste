name: macOS release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  github-release:
    name: Create or verify GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false

      - name: Create or verify release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) printf '%s\n' 'Release requires a v* tag.' >&2; exit 1 ;;
          esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" = "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi

  macos:
    name: Build and upload macOS app
    needs: github-release
    permissions:
      contents: write
    uses: ./.github/workflows/macos-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
