name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Reject hosted architecture references
        run: |
          hosted_terms='Digital''Ocean|Postgre''SQL|MCPASTE_''ENDPOINT|recovery ''code|pairing ''code|Linux ''companion'
          if git grep -n -E "$hosted_terms" -- \
            README.md SECURITY.md docs install.sh .github/workflows \
            macos/MCPaste/Sources cmd internal \
            ':!docs/superpowers/**'
          then
            printf '%s\n' 'Hosted architecture reference remains in a current product file.' >&2
            exit 1
          else
            grep_exit=$?
            if [ "$grep_exit" -ne 1 ]; then
              printf '%s\n' 'Hosted architecture scan failed.' >&2
              exit 1
            fi
          fi

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify module graph
        run: |
          go mod tidy -diff
          go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l cmd/mcpaste internal/connector internal/peer)"

      - name: Vet
        run: go vet ./cmd/mcpaste ./internal/connector ./internal/peer

      - name: Test with race detector
        run: go test -race ./cmd/mcpaste ./internal/connector ./internal/peer

      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/mcpaste ./internal/connector ./internal/peer

  swift:
    name: macOS app checks
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_15.4.app

      - name: Test and build
        run: (cd macos/MCPaste && swift test && swift build -c release)

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Reject obvious secret patterns without disclosure
        run: |
          if git grep --quiet -I -E \
            '(sk-[A-Za-z0-9]{12,}|ghp_[A-Za-z0-9]{12,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' \
            -- ':!.github/workflows/ci.yml' \
            ':!docs/security-and-secrets.md' \
            ':!docs/superpowers/**'
          then
            printf '%s\n' 'Potential secret pattern detected.' >&2
            exit 1
          else
            secret_pattern_exit=$?
            if [ "$secret_pattern_exit" -ne 1 ]; then
              printf '%s\n' 'Secret-pattern scan failed.' >&2
              exit 1
            fi
          fi

      - name: Scan repository
        run: |
          if ! /tmp/gitleaks detect --source . --redact >/tmp/gitleaks-result 2>&1; then
            printf '%s\n' 'Gitleaks detected a secret or failed to scan.' >&2
            exit 1
          fi
