name: Provision image storage

# Manually triggered maintenance for the image storage settings in
# /etc/mcpaste/server.env. Probe reports what the deploy account may do and which
# settings are already present, without printing any value.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Verify deployment host key
        env:
          DEPLOY_HOST: ${{ secrets.MCPASTE_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.MCPASTE_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          test -s "$RUNNER_TEMP/ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$RUNNER_TEMP/ssh/known_hosts" >/dev/null

      - name: Report current state
        env:
          DEPLOY_HOST: ${{ secrets.MCPASTE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MCPASTE_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.MCPASTE_DEPLOY_KEY }}
        run: |
          key_file="$RUNNER_TEMP/ssh/deploy_key"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          ssh_options=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts")
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -u
            echo "--- sudo rights ---"
            sudo -n -l 2>&1 | sed "s/^/  /" || echo "  sudo -n -l refused"
            echo "--- /opt/mcpaste/deploy contents ---"
            ls -1 /opt/mcpaste/deploy 2>&1 | sed "s/^/  /" || echo "  unreadable"
            echo "--- /etc/mcpaste ---"
            sudo -n ls -l /etc/mcpaste 2>&1 | sed "s/^/  /" || ls -ld /etc/mcpaste 2>&1 | sed "s/^/  /"
            echo "--- server.env setting names only ---"
            sudo -n awk -F= "/^[A-Z_]+=/ {print \"  \" \$1}" /etc/mcpaste/server.env 2>&1 || echo "  unreadable without sudo"
            echo "--- containers ---"
            docker ps --format "  {{.Names}}  {{.Status}}" 2>&1 | head -10 || echo "  docker not reachable for this account"
          '
