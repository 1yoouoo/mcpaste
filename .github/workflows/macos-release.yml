name: macOS release

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag whose GitHub Release receives the macOS app.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag whose GitHub Release receives the macOS app.
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    environment: release
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) printf '%s\n' 'macOS release requires a v* tag.' >&2; exit 1 ;;
          esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          gh release view "$RELEASE_TAG" >/dev/null

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_15.4.app

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Generate third-party license archive
        run: |
          licenses="$RUNNER_TEMP/THIRD_PARTY_LICENSES"
          go run github.com/google/go-licenses@v1.6.0 save ./cmd/mcpaste \
            --ignore github.com/1yoouoo/mcpaste \
            --save_path "$licenses"
          test -n "$(find "$licenses" -type f -print -quit)"
          test -z "$(find "$licenses" -type f -empty -print -quit)"
          tar -czf "$RUNNER_TEMP/THIRD_PARTY_LICENSES.tar.gz" \
            -C "$RUNNER_TEMP" THIRD_PARTY_LICENSES
          test -s "$RUNNER_TEMP/THIRD_PARTY_LICENSES.tar.gz"

      - name: Test Swift package
        working-directory: macos/MCPaste
        run: swift test

      - name: Import signing certificate
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERTIFICATE_BASE64" ]; then
            printf '%s\n' 'No signing certificate configured; the app will be ad-hoc signed.'
            exit 0
          fi
          keychain="$RUNNER_TEMP/mcpaste-signing.keychain-db"
          security create-keychain -p "$RUNNER_TEMP/keychain-password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP/keychain-password" "$keychain"
          printf '%s' "$SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"

      - name: Build, sign, and notarize app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_APP_PASSWORD }}
        working-directory: macos/MCPaste
        run: |
          swift_arm_scratch="$RUNNER_TEMP/mcpaste-swift-arm64"
          swift_x86_scratch="$RUNNER_TEMP/mcpaste-swift-x86_64"
          swift build -c release --product MCPaste \
            --triple arm64-apple-macosx14.0 \
            --scratch-path "$swift_arm_scratch"
          swift build -c release --product MCPaste \
            --triple x86_64-apple-macosx14.0 \
            --scratch-path "$swift_x86_scratch"
          swift_arm_bin="$(swift build -c release --product MCPaste \
            --triple arm64-apple-macosx14.0 \
            --scratch-path "$swift_arm_scratch" \
            --show-bin-path)"
          swift_x86_bin="$(swift build -c release --product MCPaste \
            --triple x86_64-apple-macosx14.0 \
            --scratch-path "$swift_x86_scratch" \
            --show-bin-path)"
          arm_bundle="$swift_arm_bin/MCPaste_MCPasteApp.bundle"
          x86_bundle="$swift_x86_bin/MCPaste_MCPasteApp.bundle"
          test -d "$arm_bundle"
          test -d "$x86_bundle"
          diff -qr "$arm_bundle" "$x86_bundle"

          app="$RUNNER_TEMP/MCPaste.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/Helpers"
          lipo -create \
            "$swift_arm_bin/MCPaste" \
            "$swift_x86_bin/MCPaste" \
            -output "$app/Contents/MacOS/MCPaste"
          cp -R "$arm_bundle" "$app/Contents/Resources/"
          cp Resources/Info.plist "$app/Contents/Info.plist"

          helper_arm="$RUNNER_TEMP/mcpaste-helper-arm64"
          helper_x86="$RUNNER_TEMP/mcpaste-helper-x86_64"
          (cd "$GITHUB_WORKSPACE" && \
            GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -o "$helper_arm" ./cmd/mcpaste)
          (cd "$GITHUB_WORKSPACE" && \
            GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -o "$helper_x86" ./cmd/mcpaste)
          lipo -create "$helper_arm" "$helper_x86" \
            -output "$app/Contents/Helpers/mcpaste"

          assert_universal() {
            binary="$1"
            architectures="$(lipo -archs "$binary" | tr ' ' '\n' | sed '/^$/d' | LC_ALL=C sort | paste -sd ' ' -)"
            if [ "$architectures" != 'arm64 x86_64' ]; then
              printf '%s\n' "$binary has unexpected architectures: $architectures" >&2
              exit 1
            fi
          }
          assert_universal "$app/Contents/MacOS/MCPaste"
          assert_universal "$app/Contents/Helpers/mcpaste"

          if [ -n "$SIGNING_IDENTITY" ]; then
            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$app/Contents/Helpers/mcpaste"
            codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$app"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/MCPaste.zip"
            xcrun notarytool submit "$RUNNER_TEMP/MCPaste.zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$app"
            artifact=MCPaste-final.zip
          else
            codesign --force --sign - "$app/Contents/Helpers/mcpaste"
            codesign --force --deep --sign - "$app"
            artifact=MCPaste-adhoc.zip
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/$artifact"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$artifact" > macOS-SHA256SUMS)
          cp "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md" "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md"

      - name: Upload macOS app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            "$RUNNER_TEMP"/MCPaste-*.zip \
            "$RUNNER_TEMP/macOS-SHA256SUMS" \
            "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md" \
            "$RUNNER_TEMP/THIRD_PARTY_LICENSES.tar.gz"
