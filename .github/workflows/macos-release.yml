name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    environment: release
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_15.4.app
      - name: Test package
        working-directory: macos/MCPaste
        run: swift test
      - name: Import signing certificate
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/mcpaste-signing.keychain-db"
          security create-keychain -p "$RUNNER_TEMP/keychain-password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP/keychain-password" "$keychain"
          printf '%s' "$SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
      - name: Archive and notarize
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_APP_PASSWORD }}
        working-directory: macos/MCPaste
        run: |
          xcodebuild -scheme MCPaste -configuration Release -archivePath "$RUNNER_TEMP/MCPaste.xcarchive" archive CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" DEVELOPMENT_TEAM="$TEAM_ID"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/MCPaste.xcarchive/Products/Applications/MCPaste.app" "$RUNNER_TEMP/MCPaste.zip"
          xcrun notarytool submit "$RUNNER_TEMP/MCPaste.zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$RUNNER_TEMP/MCPaste.xcarchive/Products/Applications/MCPaste.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/MCPaste.xcarchive/Products/Applications/MCPaste.app" "$RUNNER_TEMP/MCPaste-final.zip"
          shasum -a 256 "$RUNNER_TEMP/MCPaste-final.zip" > "$RUNNER_TEMP/SHA256SUMS"
      - name: Publish macOS artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/MCPaste-final.zip" "$RUNNER_TEMP/SHA256SUMS"
