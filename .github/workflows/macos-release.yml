name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    environment: release
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_15.4.app
      - name: Test package
        working-directory: macos/MCPaste
        run: swift test
      - name: Import signing certificate
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/mcpaste-signing.keychain-db"
          security create-keychain -p "$RUNNER_TEMP/keychain-password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP/keychain-password" "$keychain"
          printf '%s' "$SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
      - name: Archive and notarize
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_APP_PASSWORD }}
        working-directory: macos/MCPaste
        run: |
          swift build -c release --product MCPaste
          app="$RUNNER_TEMP/MCPaste.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$(swift build -c release --show-bin-path)/MCPaste" "$app/Contents/MacOS/MCPaste"
          cp Resources/Info.plist "$app/Contents/Info.plist"
          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/MCPaste.zip"
          xcrun notarytool submit "$RUNNER_TEMP/MCPaste.zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/MCPaste-final.zip"
          shasum -a 256 "$RUNNER_TEMP/MCPaste-final.zip" > "$RUNNER_TEMP/macOS-SHA256SUMS"
          cp "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md" "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md"
      - name: Publish macOS artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$GITHUB_REF_NAME"
          for attempt in {1..30}; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/MCPaste-final.zip" "$RUNNER_TEMP/macOS-SHA256SUMS" "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md"
              exit 0
            fi
            sleep 10
          done
          printf '%s\n' 'Linux release was not created before the macOS upload timeout.' >&2
          exit 1
